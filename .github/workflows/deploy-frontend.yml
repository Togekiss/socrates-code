jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Build
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/229267809396/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@socrates-backend-509220.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        working-directory: ./ui
        run: npx --yes firebase-tools deploy --only hosting --project socrates-backend-509220