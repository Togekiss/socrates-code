name: Deploy Frontend to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Build
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCRATES_BACKEND_509220 }}'
          projectId: socrates-backend-509220
          channelId: live
          entryPoint: ./ui
